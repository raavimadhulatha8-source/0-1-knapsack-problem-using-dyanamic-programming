
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0/1 Knapsack Problem</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>0/1 Knapsack Problem</h1>
        <p class="subtitle">Using Dynamic Programming</p>

        <div class="input-section">
            <label for="weights">Item Weights (comma separated):</label>
            <input type="text" id="weights" value="2, 3, 4, 5">

            <label for="values">Item Values (comma separated):</label>
            <input type="text" id="values" value="3, 4, 5, 6">

            <label for="capacity">Knapsack Capacity:</label>
            <input type="number" id="capacity" value="5" min="0" step="1">

            <button onclick="solveKnapsack()">Solve Knapsack</button>
            <button class="reset-btn" onclick="resetForm()">Reset</button>
        </div>

        <div id="result" class="result">
            <h2>Result</h2>
            <p>Enter the details and click Solve Knapsack.</p>
        </div>

        <div id="table-container"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
